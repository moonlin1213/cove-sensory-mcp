name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
        with:
          version: "0.8.14"
          enable-cache: false
      - run: uv sync --locked --group dev
      - run: uv run pytest -q
      - run: uv run ruff check src tests scripts
      - run: uv run mypy src/cove_sensory_mcp
      - run: uv build
      - run: uv run python scripts/privacy_scan.py .

  native-source-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-13, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
        with:
          version: "0.8.14"
          enable-cache: false
      - run: uv sync --locked --group dev
      - run: uv run pytest -q
      - run: uv run python -m cove_sensory_mcp --version

