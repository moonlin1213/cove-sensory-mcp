[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cove-sensory-mcp"
version = "0.1.0"
description = "A privacy-safe, cross-platform local stdio MCP package."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "mcp==2.0.0",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "platformdirs>=4.2",
  "keyring>=25.0",
]

[project.scripts]
cove-sensory-mcp = "cove_sensory_mcp.cli:entrypoint"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
  "build>=1.2",
  "PyInstaller>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cove_sensory_mcp"]

[tool.ruff]
target-version = "py311"
